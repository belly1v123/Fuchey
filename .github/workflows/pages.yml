# Publishes companion/ (and only companion/) to GitHub Pages.
# Site: https://belly1v123.github.io/Fuchey/
# Settings → Environments → github-pages must allow the main branch.
name: Companion on GitHub Pages

on:
  push:
    branches: [main]
    paths: ["companion/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: companion
      - id: deployment
        uses: actions/deploy-pages@v4
