; ============================================================
; Fuchey Firmware — PlatformIO Configuration
; Target: ESP32-S3-N16R8 (16MB Flash, 8MB OPI PSRAM)
; Framework: ESP-IDF
; Build System: PlatformIO
; ============================================================

[platformio]
default_envs = esp32s3_dev

[env]
platform = espressif32
framework = espidf
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB

lib_extra_dirs =
    lib/crypto
    lib/wallet
    lib/wallet_manager
    lib/wifi
    lib/chat
    lib/display
    lib/buttons
    lib/storage
    lib/weather
    lib/price
    lib/policy
    lib/protocol
    lib/config
    lib/events

[env:esp32s3_dev]
board_build.mcu           = esp32s3
board_build.f_cpu         = 240000000L
board_build.flash_mode    = qio
board_build.flash_size    = 16MB
board_build.psram_mode    = opi
board_build.partitions    = partitions.csv
board_build.sdkconfig     = sdkconfig.defaults

build_flags =
    -DCONFIG_FUCHEY_VERSION=\"1.0.0-dev\"
    -DCONFIG_FUCHEY_DEBUG=1
    -Wno-error
    -Wno-unused-parameter
    -DCONFIG_I2C_SUPPRESS_DEPRECATE_WARN=1
build_unflags =
    -fuse-cxa-atexit

lib_deps =
    esphome/libsodium @ ^1.10021.1

monitor_speed    = 115200
monitor_filters  = esp32_exception_decoder, time
upload_speed     = 921600
extra_scripts    = pre:scripts/fix_lib_build_flags.py

[env:esp32s3_release]
extends = env:esp32s3_dev
build_flags =
    -DCONFIG_FUCHEY_VERSION=\"1.0.0\"
    -DCONFIG_FUCHEY_DEBUG=0
    -O2
    -DNDEBUG
    -Wno-error
    -Wno-unused-parameter
build_unflags =
    -fuse-cxa-atexit

build_type = release
